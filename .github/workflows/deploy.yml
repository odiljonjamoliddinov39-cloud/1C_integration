name: Deploy server

# Builds the control system image, pushes it to GitHub Container Registry and starts it on the
# server over SSH. Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     the server's IP address
#   DEPLOY_SSH_KEY  a private SSH key whose public key is in the server's ~/.ssh/authorized_keys
# Optional: DEPLOY_USER (default root).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps/api/**, packages/shared/**, deploy/**, pnpm-lock.yaml, .github/workflows/deploy.yml]

permissions:
  contents: read
  packages: write

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names are lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Check deploy secrets
        id: secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::warning::DEPLOY_HOST / DEPLOY_SSH_KEY are not set: the image was built, nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER || 'root' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh_opts="-i $HOME/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          target="$USER_NAME@$HOST"
          ssh $ssh_opts "$target" "mkdir -p /opt/platform"
          scp $ssh_opts deploy/docker-compose.yml deploy/Caddyfile deploy/server-setup.sh "$target:/opt/platform/"
          ssh $ssh_opts "$target" "command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh"
          # The registry token only lives for this job; it goes in on stdin, is used to pull, then logged out.
          printf '%s' "$GHCR_TOKEN" | ssh $ssh_opts "$target" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh $ssh_opts "$target" "API_IMAGE='${{ env.IMAGE }}:${{ github.sha }}' bash /opt/platform/server-setup.sh; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"

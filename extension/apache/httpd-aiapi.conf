# Apache 2.4 + 1C web module: publish the bases on THIS laptop only.
# Include from httpd.conf, and make sure httpd.conf has no other "Listen" on 0.0.0.0 / *:80.

Listen 127.0.0.1:8080

# Path depends on the platform version, e.g. C:/Program Files/1cv8/8.3.24.1342/bin/wsap24.dll
LoadModule _1cws_module "C:/Program Files/1cv8/8.3.24.1342/bin/wsap24.dll"

<VirtualHost 127.0.0.1:8080>
    ServerName localhost

    # One block per base. "publication" points at the folder holding default.vrd.
    Alias "/TEST_CRYSTAL" "C:/1C/publish/TEST_CRYSTAL"
    <Directory "C:/1C/publish/TEST_CRYSTAL/">
        AllowOverride All
        Options None
        Require ip 127.0.0.1 ::1
        SetHandler 1c-application
        ManagedApplicationDescriptor "C:/1C/publish/TEST_CRYSTAL/default.vrd"
    </Directory>

    # Alias "/TEST_TEXMASH" "C:/1C/publish/TEST_TEXMASH"
    # <Directory "C:/1C/publish/TEST_TEXMASH/"> ... same as above ... </Directory>
</VirtualHost>

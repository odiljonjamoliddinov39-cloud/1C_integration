# One VPS, one command: `docker compose up -d --build` (see deploy/README.md).
# Secrets come from deploy/.env (never committed); copy .env.example to start.

x-backend: &backend
  build: ../backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@postgres:5432/app
    READONLY_DATABASE_URL: postgresql+psycopg://app_ro:${POSTGRES_RO_PASSWORD}@postgres:5432/app
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: '["https://${DOMAIN}"]'
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-readonly.sh:/docker-entrypoint-initdb.d/10-readonly.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    <<: *backend
    # Runs migrations, then serves the API, the /agent WebSocket and /mcp.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]

  worker:
    <<: *backend
    command: ["rq", "worker", "default", "--url", "redis://redis:6379/0"]

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.scheduler"]

  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
    restart: unless-stopped

  backup:
    image: postgres:16
    environment:
      PGHOST: postgres
      PGUSER: app
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: app
      KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./postgres/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

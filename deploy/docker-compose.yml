# The control system on one server (TD §3 "Our cloud"): PostgreSQL, the API and Caddy (HTTPS).
# Lives in /opt/platform on the server; server-setup.sh writes .env next to it on the first run.
name: platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run server-setup.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-platform-api:local}
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      JWT_SECRET: ${JWT_SECRET}
      LICENSE_PRIVATE_KEY: ${LICENSE_PRIVATE_KEY}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # The AI proxy: without a key the assistant answers AI_NOT_CONFIGURED.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      # "on": the plans' limits are enforced (docs/billing.md); "off": only counted. Override in .env.
      PLAN_LIMITS: ${PLAN_LIMITS:-on}
      # The website, where the desktop's "Upgrade" button leads (https://<site>).
      SITE_URL: ${SITE_URL:-https://1c-integration.vercel.app}
      AI_DAILY_TOKENS: ${AI_DAILY_TOKENS:-1000000}
      # How much the assistant thinks before each step: low (fastest) | medium | high.
      AI_EFFORT: ${AI_EFFORT:-high}
      # Card payments (docs/billing.md): each provider is off until its keys are in the server's .env. The keys are
      # never in the repository; "PAYME_TEST=true" is the provider's sandbox, "false" the real one.
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_TEST: ${PAYME_TEST:-true}
      PAYME_FISCAL_CODE: ${PAYME_FISCAL_CODE:-}
      PAYME_FISCAL_PACKAGE: ${PAYME_FISCAL_PACKAGE:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_MERCHANT_USER_ID: ${CLICK_MERCHANT_USER_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      BANK_REQUISITES: ${BANK_REQUISITES:-}
      # The admin dashboard's first owner (https://<site>/admin/); set from repository secrets.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Telegram remote control (docs/remote-control.md): off until the bot's token is in .env. The encryption key seals
      # queued requests and files; keep it (server-setup.sh makes it once), a new one cannot read what the old one sealed.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      REMOTE_ENCRYPTION_KEY: ${REMOTE_ENCRYPTION_KEY:-}
      MINIAPP_URL: https://${SITE_ADDRESS}/app/
    volumes:
      - remote_blobs:/var/lib/platform/remote-blobs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The desktop installer for the website's Download page (the desktop workflow puts it here).
      - ./downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  # Daily dump at 01:30 server time, kept 14 days, in /opt/platform/backups.
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: platform
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: platform
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          now=$$(date +%s); next=$$(date -d "$$(date +%F) 01:30" +%s 2>/dev/null || echo $$((now + 86400)))
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          sleep $$((next - now))
          pg_dump -Fc > /backups/platform-$$(date +%F).dump && find /backups -name 'platform-*.dump' -mtime +14 -delete
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  remote_blobs:
  caddy_data:
  caddy_config:
